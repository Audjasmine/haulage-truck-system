<div class="flex justify-between items-center mb-6">
  <h2 class="text-2xl font-bold text-gray-800">Dashboard</h2>
  <button
    (click)="refresh()"
    [disabled]="isLoading()"
    class="bg-gray-800 hover:bg-gray-900 disabled:opacity-60 text-white px-4 py-2 rounded-lg transition-colors text-sm">
    Refresh
  </button>
</div>

<div *ngIf="errorMessage()" class="mb-4 rounded-lg bg-red-100 text-red-700 px-4 py-3">
  {{ errorMessage() }}
</div>

<div *ngIf="isLoading()" class="mb-4 rounded-lg bg-gray-100 text-gray-600 px-4 py-3">
  Loading dashboard data...
</div>

<div class="grid md:grid-cols-3 gap-6">
  <div class="bg-white rounded-lg shadow p-6">
    <p class="text-gray-500 text-sm">Total Trucks</p>
    <h3 class="text-3xl font-bold text-gray-800 mt-2">{{ truckCount() }}</h3>
  </div>

  <div class="bg-white rounded-lg shadow p-6">
    <p class="text-gray-500 text-sm">Total Drivers</p>
    <h3 class="text-3xl font-bold text-gray-800 mt-2">{{ driverCount() }}</h3>
  </div>

  <div class="bg-white rounded-lg shadow p-6">
    <p class="text-gray-500 text-sm">Total Jobs</p>
    <h3 class="text-3xl font-bold text-gray-800 mt-2">{{ jobCount() }}</h3>
  </div>
</div>
